name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SDL2_VERSION: 2.30.3
  FLATPAK_ID: io.github.dinosaurplanetrecomp.dino_recomp
  # Both of these must match deploy/flatpak/<FLATPAK_ID>.yml, which currently
  # asks for the 25.08 runtime and the llvm22 SDK extension. The old build.yml
  # installed 24.08 / llvm19 and had drifted away from the manifest.
  FREEDESKTOP_VERSION: 25.08
  LLVM_VERSION: 22
  # The portable toolchain the patches Makefile needs on Windows. The clang that
  # ships with the VS image is built without MIPS targets.
  WINDOWS_LLVM_VERSION: 19.1.3

jobs:
  # Computes the short SHA the build jobs name their artifacts with. Each build
  # job is otherwise self-contained and shares nothing with the others.
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Ninja
        run: choco install ninja --no-progress --limit-output

      - name: Download portable LLVM
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Path portable-llvm -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:WINDOWS_LLVM_VERSION/LLVM-$env:WINDOWS_LLVM_VERSION-Windows-X64.tar.xz" -OutFile LLVM.tar.xz
          7z x LLVM.tar.xz -bso0 -bsp0
          7z x LLVM.tar "-oportable-llvm" -bso0 -bsp0
          Remove-Item LLVM.tar, LLVM.tar.xz -ErrorAction SilentlyContinue

      - name: Configure MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Built from the vendored submodule rather than cloned from upstream: this
      # port tracks its own fork (see .gitmodules), so a pinned upstream commit
      # would be the wrong version. Needed on every build job, since CMake
      # invokes it again during the build to regenerate RecompiledPatches/.
      - name: Build N64Recomp & RSPRecomp
        shell: pwsh
        run: |
          $cpuCores = (Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S lib/N64Recomp -B lib/N64Recomp/cmake-build
          cmake --build lib/N64Recomp/cmake-build --config Release --target N64RecompCLI -j $cpuCores
          cmake --build lib/N64Recomp/cmake-build --config Release --target RSPRecomp -j $cpuCores
          Copy-Item lib\N64Recomp\cmake-build\N64Recomp.exe .\
          Copy-Item lib\N64Recomp\cmake-build\RSPRecomp.exe .\

      - name: Run N64Recomp & RSPRecomp
        shell: pwsh
        run: |
          .\N64Recomp.exe dino.toml
          .\RSPRecomp.exe aspMain.toml

      - name: Configure CMake
        shell: pwsh
        run: |
          # Drop the preinstalled LLVM so it doesn't overshadow the VS one and
          # pull in a mismatched lld-link.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DPATCHES_C_COMPILER="..\portable-llvm\LLVM-$env:WINDOWS_LLVM_VERSION-Windows-X64\bin\clang.exe" `
            -DPATCHES_LD="..\portable-llvm\LLVM-$env:WINDOWS_LLVM_VERSION-Windows-X64\bin\ld.lld.exe" `
            -DCMAKE_CXX_FLAGS="-Xclang -fexceptions -Xclang -fcxx-exceptions" `
            -S . -B build-cmake

      - name: Build DinosaurPlanetRecompiled
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake --build build-cmake --target DinosaurPlanetRecompiled --config Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          function Copy-Artifact {
              param($FileName)
              $file = Get-ChildItem -Path build-cmake -Recurse -Filter $FileName | Select-Object -First 1
              if (-not $file) { Write-Error "Could not find '$FileName' under build-cmake/"; exit 1 }
              Copy-Item $file.FullName -Destination package\ -Force
          }
          foreach ($f in 'DinosaurPlanetRecompiled.exe', 'dxcompiler.dll', 'dxil.dll', 'SDL2.dll') {
              Copy-Artifact -FileName $f
          }
          Copy-Item recompcontrollerdb.txt package\
          Copy-Item -Recurse assets package\assets
          # Source for the stylesheets, not needed at runtime.
          Remove-Item -Recurse -Force package\assets\scss -ErrorAction SilentlyContinue

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath "DinosaurPlanetRecompiled3D-windows-${{ needs.prepare.outputs.sha_short }}.zip" -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: DinosaurPlanetRecompiled3D-windows-${{ needs.prepare.outputs.sha_short }}.zip
          if-no-files-found: error

  build-linux-x64:
    name: Linux (x64)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libdbus-1-dev libfreetype-dev lld llvm clang-15 g++-11 gcc-11 wget libfuse2

      # Built from source rather than taken from apt: 22.04 ships SDL 2.0.20,
      # which is older than rt64 wants. The runner is pinned to 22.04 anyway so
      # the release links against an older glibc and runs on more distros.
      - name: Build SDL2 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          cd SDL2-${SDL2_VERSION}
          ./configure
          make -j $(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Build N64Recomp & RSPRecomp
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S lib/N64Recomp -B lib/N64Recomp/cmake-build
          cmake --build lib/N64Recomp/cmake-build --config Release --target N64RecompCLI -j $(nproc)
          cmake --build lib/N64Recomp/cmake-build --config Release --target RSPRecomp -j $(nproc)
          cp lib/N64Recomp/cmake-build/N64Recomp .
          cp lib/N64Recomp/cmake-build/RSPRecomp .

      - name: Run N64Recomp & RSPRecomp
        run: |
          chmod +x N64Recomp RSPRecomp
          ./N64Recomp dino.toml
          ./RSPRecomp aspMain.toml

      - name: Build DinosaurPlanetRecompiled
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 \
            -DPATCHES_C_COMPILER=clang-15 -DPATCHES_LD=ld.lld-15 \
            -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B build-cmake
          cmake --build build-cmake --config Release --target DinosaurPlanetRecompiled -j $(nproc)

      - name: Create tarball
        run: |
          rm -rf assets/scss
          cp build-cmake/DinosaurPlanetRecompiled DinosaurPlanetRecompiled
          tar -czf "DinosaurPlanetRecompiled3D-linux-x64-${{ needs.prepare.outputs.sha_short }}.tar.gz" \
            DinosaurPlanetRecompiled assets/ recompcontrollerdb.txt

      # Not in the DK64 workflow this was adapted from -- that project ships no
      # AppImage. Taken from this repo's own build.yml and deploy/appimage.
      - name: Build AppImage
        run: |
          cd deploy/appimage
          curl -sSfLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod a+x ./linuxdeploy-x86_64.AppImage

          mkdir -p AppDir/usr/bin/
          mkdir -p AppDir/usr/share/metainfo/
          cp ../io.github.dinosaurplanetrecomp.dino_recomp.metainfo.xml AppDir/usr/share/metainfo/
          cp -R ../../assets/ AppDir/usr/bin/
          rm -rf AppDir/usr/bin/assets/scss/
          cp ../../recompcontrollerdb.txt AppDir/usr/bin/

          NO_STRIP=true ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable ../../build-cmake/DinosaurPlanetRecompiled \
            --desktop-file ../io.github.dinosaurplanetrecomp.dino_recomp.desktop \
            --icon-file ../../icons/512.png \
            --icon-filename io.github.dinosaurplanetrecomp.dino_recomp \
            --output appimage
          mv "Dinosaur_Planet:_Recompiled-x86_64.AppImage" \
            "../../DinosaurPlanetRecompiled3D-linux-x64-${{ needs.prepare.outputs.sha_short }}.AppImage"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            DinosaurPlanetRecompiled3D-linux-x64-${{ needs.prepare.outputs.sha_short }}.tar.gz
            DinosaurPlanetRecompiled3D-linux-x64-${{ needs.prepare.outputs.sha_short }}.AppImage
          if-no-files-found: error

  build-linux-arm64:
    name: Linux (arm64)
    needs: prepare
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libdbus-1-dev libfreetype-dev lld llvm clang-15 g++-11 gcc-11 wget libfuse2

      - name: Build SDL2 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          cd SDL2-${SDL2_VERSION}
          ./configure
          make -j $(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/aarch64-linux-gnu/

      - name: Build N64Recomp & RSPRecomp
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S lib/N64Recomp -B lib/N64Recomp/cmake-build
          cmake --build lib/N64Recomp/cmake-build --config Release --target N64RecompCLI -j $(nproc)
          cmake --build lib/N64Recomp/cmake-build --config Release --target RSPRecomp -j $(nproc)
          cp lib/N64Recomp/cmake-build/N64Recomp .
          cp lib/N64Recomp/cmake-build/RSPRecomp .

      - name: Run N64Recomp & RSPRecomp
        run: |
          chmod +x N64Recomp RSPRecomp
          ./N64Recomp dino.toml
          ./RSPRecomp aspMain.toml

      - name: Build DinosaurPlanetRecompiled
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 \
            -DPATCHES_C_COMPILER=clang-15 -DPATCHES_LD=ld.lld-15 \
            -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B build-cmake
          cmake --build build-cmake --config Release --target DinosaurPlanetRecompiled -j $(nproc)

      - name: Create tarball
        run: |
          rm -rf assets/scss
          cp build-cmake/DinosaurPlanetRecompiled DinosaurPlanetRecompiled
          tar -czf "DinosaurPlanetRecompiled3D-linux-arm64-${{ needs.prepare.outputs.sha_short }}.tar.gz" \
            DinosaurPlanetRecompiled assets/ recompcontrollerdb.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: DinosaurPlanetRecompiled3D-linux-arm64-${{ needs.prepare.outputs.sha_short }}.tar.gz
          if-no-files-found: error

  build-linux-flatpak:
    name: Linux (flatpak)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder clang lld

      - name: Prepare Flatpak runtime/SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Sdk//${FREEDESKTOP_VERSION}
          flatpak --user install -y flathub org.freedesktop.Sdk.Extension.llvm${LLVM_VERSION}//${FREEDESKTOP_VERSION}

      - name: Build Flatpak bundle
        run: |
          git config --global protocol.file.allow always
          make -C patches CC=clang LD=ld.lld
          cd deploy/flatpak
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo builddir ${FLATPAK_ID}.yml
          flatpak build-bundle repo "DinosaurPlanetRecompiled3D-flatpak-${{ needs.prepare.outputs.sha_short }}.flatpak" ${FLATPAK_ID} --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: deploy/flatpak/DinosaurPlanetRecompiled3D-flatpak-${{ needs.prepare.outputs.sha_short }}.flatpak
          if-no-files-found: error

  publish:
    name: Publish rolling release
    needs: [prepare, build-windows, build-linux-x64, build-linux-arm64, build-linux-flatpak]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rolling --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create rolling dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rolling Release" \
            --notes "Built from $GITHUB_SHA (${{ needs.prepare.outputs.sha_short }})"
